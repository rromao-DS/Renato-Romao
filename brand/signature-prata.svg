<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 136" width="760" height="272">
  <rect width="380" height="136" fill="#F5F5F7"/>

  <!-- Logo símbolo (escala 44/240, topo y=14) -->
  <g transform="translate(20,14)">
    <rect x="3.7" y="15.6" width="12.8" height="12.8" fill="#080C14"/>
    <rect x="27.5" y="15.6" width="12.8" height="12.8" fill="#080C14"/>
    <line x1="16.5" y1="22.9" x2="27.5" y2="18.5" stroke="#080C14" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- R2 Tech Consulting abaixo da logo, alinhado à largura do símbolo -->
